[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formora-api"
version = "0.1.0"
description = "Local-first template-preserving document compiler API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "lxml>=5.4,<7",
  "httpx>=0.28,<1",
  "openai>=1.97,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
